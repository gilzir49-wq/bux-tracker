<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1F5D24">
<title>BUX · האימון היומי</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUX אימונים">
<style>
:root{
  --bg:#0d1410;--bg2:#13201a;--card:#16241c;--card2:#1d3026;
  --txt:#f3f7f3;--muted:#9db3a4;--line:#244233;
  --green:#1F5D24;--green-lite:#2e8b3d;--gold:#F1C93B;--gold-deep:#d9ad1f;
  --radius:18px;--shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Heebo","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:radial-gradient(1100px 560px at 100% -8%,#16331f 0,var(--bg) 55%);
  color:var(--txt);line-height:1.45;min-height:100vh;padding-bottom:46px}
.wrap{max-width:720px;margin:0 auto;padding:13px}
.logobar{text-align:center;padding:2px 0 8px}
.logobar img{width:40%;max-width:128px;height:auto;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;
  border-radius:var(--radius);background:linear-gradient(135deg,var(--green),#0e1c12);
  box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold),var(--green-lite));height:5px}
.top h1{margin:0;font-size:18px;font-weight:900}
.top .sub{color:#cfe6d6;font-size:12px;margin-top:2px}
.top .me{text-align:left;font-size:11px;color:#cfe6d6}
.top .me b{color:var(--gold);font-size:13px;display:block}
.top .me span{cursor:pointer;text-decoration:underline}

.viewtoggle{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px;margin:13px 0 10px;gap:5px}
.viewtoggle button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:15px;padding:12px;border-radius:999px;cursor:pointer;transition:.15s}
.viewtoggle button.active{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1400;box-shadow:0 4px 14px rgba(241,201,59,.3)}

/* פס ימים */
.weekbar{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:8px}
.weekbar .nav{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:34px;height:46px;flex:0 0 auto;font-size:16px;cursor:pointer}
.days{display:flex;flex:1;gap:3px}
.day{flex:1;text-align:center;border-radius:11px;padding:6px 2px;cursor:pointer;border:1px solid transparent}
.day .dl{font-size:11px;color:var(--muted);font-weight:700}
.day .dn{font-size:16px;font-weight:900;margin-top:2px}
.day .marks{height:12px;font-size:10px;line-height:1}
.day.sel{background:linear-gradient(135deg,var(--green-lite),var(--green));border-color:var(--gold)}
.day.sel .dl{color:#dff5e4}
.day .prog{color:var(--gold)}
.day .att{color:var(--green-lite)}
.datepick{display:flex;justify-content:center;margin-bottom:12px}
.datepick input{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}

.syncdot{font-size:11px;color:var(--muted);text-align:center;margin:0 0 10px;font-weight:700}

/* כותרת תוכנית */
.proghead{text-align:center;margin:4px 0 12px}
.proghead .pt{font-size:24px;font-weight:900}
.proghead .pd{font-size:13px;color:var(--muted)}

/* כרטיס מקטע */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:13px;overflow:hidden}
.sec .sh{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--card2);border-bottom:1px solid var(--line)}
.sec .sh .ic{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.sec .sh .st{font-weight:900;font-size:16px}
.sec .sb{padding:14px 15px}
.sec .body{white-space:pre-wrap;font-size:15px;line-height:1.55}
.lb-tag{display:inline-block;font-size:11px;font-weight:900;color:var(--gold);background:rgba(241,201,59,.12);border:1px solid rgba(241,201,59,.35);border-radius:999px;padding:3px 9px;margin-bottom:8px}

/* סרטונים */
.vids{display:flex;gap:9px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.vid{flex:0 0 auto;width:150px;border-radius:11px;overflow:hidden;background:#000;position:relative;cursor:pointer;border:1px solid var(--line)}
.vid img{width:100%;height:90px;object-fit:cover;display:block;opacity:.9}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.vid .vlabel{position:absolute;bottom:0;right:0;left:0;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);color:#fff;font-size:12px;font-weight:700;padding:14px 8px 6px}
.vid iframe{width:100%;height:90px;border:0;display:block}
.vid.open{width:260px}.vid.open iframe{height:150px}
.vid.vlink{height:90px;background:linear-gradient(135deg,#3a0f12,#1a0709);display:flex;align-items:flex-end;text-decoration:none}
.vid.vlink .play{color:#ff4d4d}
.vid.vlink .yt{position:absolute;top:6px;right:8px;font-size:10px;font-weight:900;color:#ff4d4d;background:rgba(0,0,0,.4);border-radius:6px;padding:2px 6px}

/* מדדים / תוצאות */
.metric{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.metric .top2{display:flex;align-items:center;gap:8px}
.metric .ml{font-weight:800;font-size:14px;flex:1}
.metric .ml .mu{color:var(--muted);font-weight:600;font-size:12px}
.metric input.mval{width:110px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:15px;text-align:center}
.metric .hist{background:var(--card2);border:1px solid var(--line);color:var(--gold);border-radius:9px;width:40px;height:38px;cursor:pointer;font-size:15px;flex:0 0 auto}
.metric .last{font-size:11.5px;color:var(--muted);margin-top:5px}
.metric .pr{color:var(--gold);font-weight:800}
/* לידרבורד */
.lboard{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.lboard .lt{font-size:12px;font-weight:900;color:var(--gold);margin-bottom:6px}
.lrow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04)}
.lrow .rk{color:var(--muted);font-weight:800;margin-left:6px}
.lrow.mine{color:var(--gold);font-weight:800}

.attbtn{width:100%;border:0;font:inherit;font-weight:900;font-size:16px;padding:14px;border-radius:13px;cursor:pointer;margin:4px 0 14px;
  background:var(--card);color:var(--txt);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}
.attbtn.done{background:linear-gradient(135deg,var(--green-lite),var(--green));color:#fff;border:0}

.empty-state{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.btn{width:100%;border:0;font:inherit;font-weight:900;font-size:16px;padding:14px;border-radius:13px;cursor:pointer;margin-top:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1400;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.99)}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-size:14px}
.btn.sm{width:auto;padding:9px 13px;font-size:13px;margin:0}
.btn.danger{background:transparent;color:#fca5a5;border:1px solid #7f2d1d}
.btn.row{margin-top:8px}

/* עורך מאמן */
#coachLock{text-align:center;padding:26px 16px}
#coachLock .big{font-size:40px}
#coachLock p{color:var(--muted);font-size:14px;margin:8px 0 16px}
.ed label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:11px 0 0}
.ed input,.ed textarea{width:100%;margin-top:5px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.ed textarea{min-height:90px;resize:vertical}
.edsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px}
.edsec .eh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edsec .eh .num{font-weight:900;color:var(--gold)}
.subrow{display:flex;gap:7px;margin-top:7px;align-items:center}
.subrow input{margin-top:0}
.subrow .rm{background:transparent;border:1px solid #7f2d1d;color:#fca5a5;border-radius:9px;width:38px;height:40px;flex:0 0 auto;cursor:pointer}
.mini{font-size:12px;color:var(--muted);font-weight:800;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:700}
.chk input{width:auto;margin:0}
.barbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;line-height:1.7}
footer b{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.show{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{color:var(--muted);font-size:13px;margin:0 0 12px}
.modal input{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:15px}
.histrow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.histrow.best{color:var(--gold);font-weight:800}

.subtabs{display:flex;gap:7px;margin-bottom:10px}
.subtabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-weight:800;font-size:14px;padding:11px;border-radius:12px;cursor:pointer}
.subtabs button.active{background:var(--card2);color:var(--gold);border-color:var(--gold)}
#coachTrack{display:none}
body.ct-track #coachTrack{display:block}
body.ct-track #coachEditor{display:none}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:12px}
.tcard h4{margin:0 0 9px;font-size:15px;display:flex;align-items:center;gap:7px}
.tcard .att-names{display:flex;flex-wrap:wrap;gap:6px}
.tchip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.tchip.on{background:linear-gradient(135deg,var(--green-lite),var(--green));color:#fff;border:0}
.tmetric{margin-top:11px}
.tmetric .tml{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:4px}
.tmember-pick{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;font-size:15px;margin-bottom:12px}
.prog-line{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.prog-line .pv{font-weight:800}
.prog-line .pv .pr{color:var(--gold)}
.prog-line .pd2{color:var(--muted);font-size:11px}
#viewMember,#viewCoach{display:none}
body.v-member #viewMember{display:block}
body.v-coach #viewCoach{display:block}
body:not(.coach-on) #coachContent{display:none}
body.coach-on #coachLock{display:none}
</style>
</head>
<body class="v-member">
<div class="wrap">

<div class="logobar"><img src="logo.png" alt="CrossFit BUX"></div>
<header class="top">
  <div><h1>האימון היומי 🦌</h1><div class="sub">CrossFit BUX · יהוד</div></div>
  <div class="me" id="meBox"></div>
</header>

<div class="viewtoggle">
  <button id="btnMember">🏋️ מתאמן</button>
  <button id="btnCoach">🧠 מאמן</button>
</div>

<!-- פס ימים -->
<div class="weekbar">
  <button class="nav" id="prevWk">›</button>
  <div class="days" id="daysStrip"></div>
  <button class="nav" id="nextWk">‹</button>
</div>
<div class="datepick"><input type="date" id="datePick"></div>
<div class="syncdot" id="syncDot">☁️ מתחבר…</div>

<!-- ===================== מתאמן ===================== -->
<div id="viewMember">
  <div id="memberProgram"></div>
</div>

<!-- ===================== מאמן ===================== -->
<div id="viewCoach">
  <div id="coachLock">
    <div class="big">🔒</div>
    <p>אזור מאמן — כתיבת תוכנית האימון היומית.<br>הזינו את הקוד כדי להיכנס.</p>
    <button class="btn sm" id="btnUnlock" style="margin:0 auto">🔓 כניסה עם קוד</button>
  </div>
  <div id="coachContent">
    <div class="subtabs">
      <button id="ctPlan" class="active">✏️ תכנון האימון</button>
      <button id="ctTrack">📊 מעקב מתאמנים</button>
    </div>
    <div id="coachEditor"></div>
    <div id="coachTrack"></div>
  </div>
</div>

<footer><b>CrossFit BUX</b> · האימון היומי<br>שמרו את הלינק במסך הבית 💪</footer>
</div>

<!-- מודאלים -->
<div class="modal" id="nameModal"><div class="box">
  <h3>ברוכים הבאים! 👋</h3>
  <p>איך קוראים לך? (כדי שנשייך את התוצאות אליך)</p>
  <input type="text" id="nameInput" placeholder="השם שלך">
  <button class="btn" id="nameSave">המשך</button>
</div></div>

<div class="modal" id="histModal"><div class="box">
  <h3 id="histTitle">היסטוריה</h3>
  <p id="histSub"></p>
  <div id="histList"></div>
  <button class="btn sec2" id="histClose" style="margin-top:14px">סגירה</button>
</div></div>

<!-- ============================================================= -->
<!-- ===============   הגדרות (לעריכה קלה)   ===================== -->
<!-- ============================================================= -->
<script id="CONFIG">
/* COACH_PIN = הקוד שמכניס לאזור המאמן (כתיבת תוכניות). שנה אם תרצה. */
const DB   = "https://command-center-gal-default-rtdb.europe-west1.firebasedatabase.app";
const NODE = "bux-tracker";
const COACH_PIN = "bux2026";
/* אמוג'י לכל סוג מקטע (לפי מילה בכותרת) */
const SEC_ICONS = [
  [/חימום|warm/i,"🔥"],[/כוח|strength|weightlift|משקול/i,"🏋️"],
  [/clean|חטיפה|נטיש|הנפה|סנאצ|snatch/i,"💪"],[/crossfit|metcon|wod|מטקון/i,"⚡"],
  [/ריצה|run|אירובי|cardio/i,"🏃"],[/מתיחות|שחרור|cool|mobility|מוביל/i,"🧘"],[/ליבה|core|בטן/i,"🎯"]
];
</script>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const HE_L=["א","ב","ג","ד","ה","ו","ש"];
function isoToDate(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function dateToISO(dt){return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;}
function addDays(iso,n){const dt=isoToDate(iso);dt.setDate(dt.getDate()+n);return dateToISO(dt);}
function todayISO(){return dateToISO(new Date());}
function weekOf(iso){const dt=isoToDate(iso);const start=addDays(iso,-dt.getDay());return Array.from({length:7},(_,i)=>addDays(start,i));}
function fmtLong(iso){const[y,m,d]=iso.split("-");return `${d}.${m}.${y}`;}
function genId(){return `${Date.now()}-${Math.random().toString(36).slice(2,7)}`;}
function secIcon(t){for(const[re,ic]of SEC_ICONS)if(re.test(t||""))return ic;return "📋";}
function ytId(u){const m=(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:"";}
function isNum(v){return v!==""&&v!=null&&!isNaN(parseFloat(v));}

/* ---------- מצב ---------- */
let SELDATE=todayISO(), PROG=null, PROGDATES={}, RESULTS=[], DRAFT=null, coachOn=false;
let MEMBER=""; try{MEMBER=localStorage.getItem("bux_member")||"";}catch(e){}
try{coachOn=sessionStorage.getItem("bux_coach")==="1";}catch(e){}
let coachTab="plan"; try{coachTab=localStorage.getItem("bux_ctab")||"plan";}catch(e){}
let trackMember="";

/* ---------- ענן ---------- */
function setSync(t){$("syncDot").textContent=t;}
async function fetchProgram(d){try{const r=await fetch(`${DB}/${NODE}/program/${d}.json`,{cache:"no-store"});return r.ok?await r.json():null;}catch(e){return null;}}
async function fetchProgDates(){try{const r=await fetch(`${DB}/${NODE}/program.json?shallow=true`);return r.ok?(await r.json()||{}):{};}catch(e){return {};}}
async function fetchResults(){try{const r=await fetch(`${DB}/${NODE}/results.json`,{cache:"no-store"});const o=r.ok?(await r.json()||{}):{};return Object.entries(o).map(([id,v])=>({id,...v}));}catch(e){return [];}}
async function putProgram(d,p){await fetch(`${DB}/${NODE}/program/${d}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});}
async function delProgramCloud(d){await fetch(`${DB}/${NODE}/program/${d}.json`,{method:"DELETE"});}
async function putResult(e){await fetch(`${DB}/${NODE}/results/${e.id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)});}
async function delResultCloud(id){await fetch(`${DB}/${NODE}/results/${id}.json`,{method:"DELETE"});}

async function loadAll(){
  const [p,pd,res]=await Promise.all([fetchProgram(SELDATE),fetchProgDates(),fetchResults()]);
  PROG=p; PROGDATES=pd; RESULTS=res; setSync("☁️ מסונכרן");
}

/* ---------- שם ---------- */
function renderMe(){
  $("meBox").innerHTML=MEMBER?`מתאמן<b>${esc(MEMBER)}</b><span>שינוי שם</span>`:"";
  const sp=$("meBox").querySelector("span"); if(sp)sp.onclick=askName;
}
function askName(){$("nameInput").value=MEMBER;$("nameModal").classList.add("show");$("nameInput").focus();}
$("nameSave").onclick=()=>{const v=$("nameInput").value.trim();if(!v){$("nameInput").focus();return;}MEMBER=v;try{localStorage.setItem("bux_member",v);}catch(e){}$("nameModal").classList.remove("show");renderMe();renderMember();};

/* ---------- פס ימים ---------- */
function myAttended(date){return RESULTS.some(r=>r.member===MEMBER&&r.date===date&&r.metricLabel==="__att__");}
function renderWeek(){
  const wk=weekOf(SELDATE);
  $("daysStrip").innerHTML=wk.map(d=>{
    const dt=isoToDate(d), dl=HE_L[dt.getDay()], dn=dt.getDate();
    const hasProg=!!PROGDATES[d], att=myAttended(d);
    return `<div class="day ${d===SELDATE?'sel':''}" data-d="${d}">
      <div class="dl">${dl}</div><div class="dn">${dn}</div>
      <div class="marks">${att?'<span class="att">✓</span>':(hasProg?'<span class="prog">●</span>':'')}</div></div>`;
  }).join("");
  $("datePick").value=SELDATE;
}
$("daysStrip").addEventListener("click",e=>{const d=e.target.closest("[data-d]");if(d){SELDATE=d.dataset.d;reload();}});
$("prevWk").onclick=()=>{SELDATE=addDays(SELDATE,-7);reload();};
$("nextWk").onclick=()=>{SELDATE=addDays(SELDATE,7);reload();};
$("datePick").onchange=e=>{SELDATE=e.target.value||todayISO();reload();};

/* ---------- תוצאות עזר ---------- */
function findResult(date,member,sid,label){return RESULTS.find(r=>r.date===date&&r.member===member&&r.sectionId===sid&&r.metricLabel===label);}
function memberHistory(label){return RESULTS.filter(r=>r.member===MEMBER&&r.metricLabel===label&&isNum(r.value)).sort((a,b)=>a.date<b.date?-1:1);}

/* ---------- תצוגת מתאמן ---------- */
function videoHTML(v){
  const id=ytId(v.url);
  if(id){
    const thumb=`https://img.youtube.com/vi/${id}/mqdefault.jpg`;
    return `<div class="vid" data-yt="${id}"><img src="${thumb}" alt=""><span class="play">▶</span><span class="vlabel">${esc(v.label||"")}</span></div>`;
  }
  if(v.url){
    return `<a class="vid vlink" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="yt">YouTube</span><span class="play">▶</span><span class="vlabel">${esc(v.label||"סרטון")}</span></a>`;
  }
  return "";
}
function metricHTML(m,sid){
  const ex=findResult(SELDATE,MEMBER,sid,m.label);
  const hist=memberHistory(m.label);
  const best=hist.length?Math.max(...hist.map(h=>parseFloat(h.value))):null;
  let lastTxt="";
  if(hist.length){
    const prev=hist.filter(h=>h.date<SELDATE).slice(-1)[0];
    if(prev) lastTxt=`קודם: ${esc(prev.value)} ${esc(m.unit||"")} · שיא: <span class="pr">${best}</span>`;
    else if(best!=null) lastTxt=`שיא אישי: <span class="pr">${best}</span> ${esc(m.unit||"")}`;
  }
  return `<div class="metric">
    <div class="top2">
      <div class="ml">${esc(m.label)} ${m.unit?`<span class="mu">(${esc(m.unit)})</span>`:""}</div>
      <input class="mval" data-sid="${sid}" data-label="${esc(m.label)}" data-unit="${esc(m.unit||"")}" inputmode="decimal" value="${ex?esc(ex.value):""}" placeholder="תוצאה">
      <button class="hist" data-histlabel="${esc(m.label)}" data-histunit="${esc(m.unit||"")}">📈</button>
    </div>
    ${lastTxt?`<div class="last">${lastTxt}</div>`:""}
  </div>`;
}
function leaderboardHTML(sec){
  const m=sec.metrics&&sec.metrics[0]; if(!m) return "";
  let rows=RESULTS.filter(r=>r.date===SELDATE&&r.sectionId===sec.id&&r.metricLabel===m.label&&r.value!=="");
  if(!rows.length) return `<div class="lboard"><div class="lt">🏆 לוח תוצאות</div><div class="last">עדיין אין תוצאות להיום</div></div>`;
  const numeric=rows.every(r=>isNum(r.value));
  rows.sort((a,b)=>numeric?(parseFloat(b.value)-parseFloat(a.value)):(a.member<b.member?-1:1));
  return `<div class="lboard"><div class="lt">🏆 לוח תוצאות — ${esc(m.label)}</div>`+
    rows.map((r,i)=>`<div class="lrow ${r.member===MEMBER?'mine':''}"><span><span class="rk">${i+1}.</span>${esc(r.member)}</span><span>${esc(r.value)} ${esc(m.unit||"")}</span></div>`).join("")+`</div>`;
}
function renderMember(){
  renderWeek();
  if(!PROG||!PROG.sections||!PROG.sections.length){
    $("memberProgram").innerHTML=`<div class="proghead"><div class="pd">${fmtLong(SELDATE)}</div></div>
      <div class="empty-state">אין אימון מתוכנן ליום הזה 🌙<br>בחרו יום אחר מהלוח למעלה.</div>`;
    return;
  }
  const att=myAttended(SELDATE);
  let html=`<div class="proghead"><div class="pt">${esc(PROG.title||"אימון היום")}</div><div class="pd">${fmtLong(SELDATE)}</div></div>`;
  html+=`<button class="attbtn ${att?'done':''}" id="attBtn">${att?'✓ סימנת שהתאמנת היום':'הייתי באימון הזה 💪'}</button>`;
  html+=PROG.sections.map((s,si)=>{
    const vids=(s.videos||[]).filter(v=>v.url||v.label);
    const mets=(s.metrics||[]).filter(m=>m.label);
    return `<div class="sec">
      <div class="sh"><div class="ic">${secIcon(s.title)}</div><div class="st">${esc(s.title||"מקטע")}</div></div>
      <div class="sb">
        ${s.leaderboard?'<span class="lb-tag">🏆 לוח תוצאות יומי</span><br>':''}
        ${s.body?`<div class="body">${esc(s.body)}</div>`:""}
        ${vids.length?`<div class="vids">${vids.map(videoHTML).join("")}</div>`:""}
        ${mets.map(m=>metricHTML(m,s.id)).join("")}
        ${s.leaderboard?leaderboardHTML(s):""}
      </div></div>`;
  }).join("");
  $("memberProgram").innerHTML=html;
  $("attBtn").onclick=toggleAttend;
}
async function toggleAttend(){
  if(!MEMBER){askName();return;}
  const ex=findResult(SELDATE,MEMBER,"__day__","__att__");
  if(ex){ await delResultCloud(ex.id); RESULTS=RESULTS.filter(r=>r.id!==ex.id); }
  else{ const e={id:genId(),date:SELDATE,member:MEMBER,sectionId:"__day__",metricLabel:"__att__",value:"1",unit:"",createdAt:Date.now()}; await putResult(e); RESULTS.push(e); }
  renderMember();
}

/* לחיצות מתאמן: וידאו, היסטוריה, הזנת תוצאה */
$("memberProgram").addEventListener("click",e=>{
  const vid=e.target.closest(".vid");
  if(vid&&!vid.classList.contains("open")&&vid.dataset.yt){
    vid.classList.add("open");
    vid.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid.dataset.yt}?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    return;
  }
  const hb=e.target.closest(".hist");
  if(hb){ showHistory(hb.dataset.histlabel,hb.dataset.histunit); return; }
});
$("memberProgram").addEventListener("change",async e=>{
  const inp=e.target.closest(".mval"); if(!inp) return;
  if(!MEMBER){askName();return;}
  const sid=inp.dataset.sid,label=inp.dataset.label,unit=inp.dataset.unit,val=inp.value.trim();
  let ex=findResult(SELDATE,MEMBER,sid,label);
  if(!val){ if(ex){await delResultCloud(ex.id);RESULTS=RESULTS.filter(r=>r.id!==ex.id);} return; }
  if(ex){ ex.value=val; ex.unit=unit; await putResult(ex); }
  else{ ex={id:genId(),date:SELDATE,member:MEMBER,sectionId:sid,metricLabel:label,value:val,unit,createdAt:Date.now()}; await putResult(ex); RESULTS.push(ex); }
});

/* היסטוריה */
function showHistory(label,unit){
  const h=memberHistory(label);
  $("histTitle").textContent="📈 "+label;
  if(!h.length){ $("histSub").textContent="עדיין אין תוצאות שמורות."; $("histList").innerHTML=""; }
  else{
    const best=Math.max(...h.map(x=>parseFloat(x.value)));
    $("histSub").textContent=`${h.length} תוצאות · שיא אישי ${best} ${unit||""}`;
    $("histList").innerHTML=h.slice().reverse().map(x=>`<div class="histrow ${parseFloat(x.value)===best?'best':''}"><span>${fmtLong(x.date)}</span><span>${esc(x.value)} ${esc(unit||"")} ${parseFloat(x.value)===best?'🏆':''}</span></div>`).join("");
  }
  $("histModal").classList.add("show");
}
$("histClose").onclick=()=>$("histModal").classList.remove("show");

/* ---------- עורך מאמן ---------- */
function blankSection(){return {id:genId(),title:"",body:"",videos:[],metrics:[],leaderboard:false};}
function startDraft(){ DRAFT = PROG?JSON.parse(JSON.stringify(PROG)):{title:"",sections:[blankSection()]}; if(!DRAFT.sections||!DRAFT.sections.length)DRAFT.sections=[blankSection()]; DRAFT.sections.forEach(s=>{s.videos=s.videos||[];s.metrics=s.metrics||[];s.id=s.id||genId();}); }
function harvest(){
  if(!DRAFT) return;
  DRAFT.title=($("edTitle")?$("edTitle").value:DRAFT.title)||"";
  DRAFT.sections.forEach((s,si)=>{
    const t=document.querySelector(`[data-stitle="${si}"]`); if(t)s.title=t.value;
    const b=document.querySelector(`[data-sbody="${si}"]`); if(b)s.body=b.value;
    const lb=document.querySelector(`[data-slb="${si}"]`); if(lb)s.leaderboard=lb.checked;
    s.videos.forEach((v,vi)=>{const l=document.querySelector(`[data-vlabel="${si}-${vi}"]`),u=document.querySelector(`[data-vurl="${si}-${vi}"]`);if(l)v.label=l.value;if(u)v.url=u.value;});
    s.metrics.forEach((m,mi)=>{const l=document.querySelector(`[data-mlabel="${si}-${mi}"]`),u=document.querySelector(`[data-munit="${si}-${mi}"]`);if(l)m.label=l.value;if(u)m.unit=u.value;});
  });
}
function renderCoach(){
  if(!coachOn) return;
  renderWeek();
  document.body.classList.toggle("ct-track",coachTab==="track");
  $("ctPlan").classList.toggle("active",coachTab==="plan");
  $("ctTrack").classList.toggle("active",coachTab==="track");
  if(coachTab==="track"){ renderTrack(); return; }
  renderEditor();
}
function renderTrack(){
  const real=RESULTS.filter(r=>r.metricLabel!=="__att__");
  const members=[...new Set(RESULTS.map(r=>r.member))].sort();
  const att=RESULTS.filter(r=>r.date===SELDATE&&r.metricLabel==="__att__").map(r=>r.member).sort();
  const today=real.filter(r=>r.date===SELDATE);
  const groups={}; today.forEach(r=>{(groups[r.metricLabel]=groups[r.metricLabel]||[]).push(r);});
  let html=`<div class="tcard"><h4>📅 ${fmtLong(SELDATE)} — ${esc((PROG&&PROG.title)||"")}</h4>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">נוכחות: <b style="color:var(--gold)">${att.length}</b> מתאמנים</div>
    <div class="att-names">${att.length?att.map(m=>`<span class="tchip on">${esc(m)}</span>`).join(""):'<span style="color:var(--muted);font-size:13px">עדיין אף אחד לא סימן נוכחות היום</span>'}</div>`;
  Object.keys(groups).forEach(lbl=>{
    const rows=groups[lbl].slice().sort((a,b)=>(isNum(a.value)&&isNum(b.value))?parseFloat(b.value)-parseFloat(a.value):0);
    html+=`<div class="tmetric"><div class="tml">🏆 ${esc(lbl)}</div>`+
      rows.map((r,i)=>`<div class="prog-line"><span>${i+1}. ${esc(r.member)}</span><span class="pv">${esc(r.value)} ${esc(r.unit||"")}</span></div>`).join("")+`</div>`;
  });
  html+=`</div>`;
  html+=`<div class="tcard"><h4>👤 מעקב אישי לפי מתאמן</h4>
    <select class="tmember-pick" id="trackPick"><option value="">בחר מתאמן…</option>${members.map(m=>`<option value="${esc(m)}" ${m===trackMember?"selected":""}>${esc(m)}</option>`).join("")}</select>`;
  if(trackMember){
    const mine=real.filter(r=>r.member===trackMember);
    const attCount=RESULTS.filter(r=>r.member===trackMember&&r.metricLabel==="__att__").length;
    const byLabel={}; mine.forEach(r=>{(byLabel[r.metricLabel]=byLabel[r.metricLabel]||[]).push(r);});
    const keys=Object.keys(byLabel).sort();
    html+=`<div style="font-size:13px;color:var(--muted);margin-bottom:8px">✅ ${attCount} אימונים · ${keys.length} תרגילים שנמדדו</div>`;
    if(!keys.length) html+=`<div style="color:var(--muted);font-size:13px">אין תוצאות שמורות עדיין.</div>`;
    keys.forEach(lbl=>{
      const arr=byLabel[lbl].slice().sort((a,b)=>a.date<b.date?-1:1);
      const last=arr[arr.length-1];
      const nums=arr.filter(x=>isNum(x.value)).map(x=>parseFloat(x.value));
      const pr=nums.length?Math.max(...nums):null;
      html+=`<div class="prog-line"><span>${esc(lbl)}<div class="pd2">${arr.length} פעמים · אחרון ${fmtLong(last.date)}</div></span>
        <span class="pv">${esc(last.value)} ${esc(last.unit||"")}${pr!=null?` · <span class="pr">שיא ${pr}</span>`:""}</span></div>`;
    });
  }
  html+=`</div>`;
  $("coachTrack").innerHTML=html;
  const pick=$("trackPick"); if(pick) pick.onchange=e=>{trackMember=e.target.value;renderTrack();};
}
function renderEditor(){
  if(!DRAFT) startDraft();
  let html=`<div class="proghead"><div class="pd">תוכנית ליום ${fmtLong(SELDATE)}</div></div>
    <div class="ed">
    <label>שם התוכנית<input id="edTitle" value="${esc(DRAFT.title||"")}" placeholder="למשל: The Progrm 1"></label>`;
  DRAFT.sections.forEach((s,si)=>{
    html+=`<div class="edsec">
      <div class="eh"><span class="num">מקטע ${si+1}</span>
        <button class="btn sm danger" data-rmsec="${si}">🗑 הסר מקטע</button></div>
      <label>כותרת (חימום / כוח / קרוספיט…)<input data-stitle="${si}" value="${esc(s.title||"")}" placeholder="כותרת המקטע"></label>
      <label>תוכן האימון<textarea data-sbody="${si}" placeholder="פירוט התרגילים, סבבים, אחוזים, הערות…">${esc(s.body||"")}</textarea></label>
      <div class="mini">🎬 סרטוני יוטיוב לתרגילים</div>`;
    (s.videos||[]).forEach((v,vi)=>{html+=`<div class="subrow">
      <input data-vlabel="${si}-${vi}" value="${esc(v.label||"")}" placeholder="שם התרגיל" style="flex:1">
      <input data-vurl="${si}-${vi}" value="${esc(v.url||"")}" placeholder="קישור יוטיוב" style="flex:1.4">
      <button class="rm" data-rmvid="${si}-${vi}">✕</button></div>`;});
    html+=`<button class="btn sec2 row sm" data-addvid="${si}" style="width:100%">+ הוספת סרטון</button>
      <div class="mini">📊 מדדים להזנת תוצאה (כל מתאמן ימלא)</div>`;
    (s.metrics||[]).forEach((m,mi)=>{html+=`<div class="subrow">
      <input data-mlabel="${si}-${mi}" value="${esc(m.label||"")}" placeholder="שם המדד (8RM Push Press)" style="flex:1.6">
      <input data-munit="${si}-${mi}" value="${esc(m.unit||"")}" placeholder="יחידה (kg)" style="flex:.7">
      <button class="rm" data-rmmet="${si}-${mi}">✕</button></div>`;});
    html+=`<button class="btn sec2 row sm" data-addmet="${si}" style="width:100%">+ הוספת מדד</button>
      <label class="chk"><input type="checkbox" data-slb="${si}" ${s.leaderboard?"checked":""}> הצג לוח תוצאות יומי למקטע זה 🏆</label>
    </div>`;
  });
  html+=`<button class="btn sec2" data-addsec="1">＋ הוספת מקטע</button>
    <button class="btn" id="edSave">💾 שמירה ופרסום לכל המתאמנים</button>
    <div class="barbtns">
      <button class="btn sm sec2" id="edCopy">📋 שכפול מאתמול</button>
      ${PROG?'<button class="btn sm danger" id="edDelete">🗑 מחיקת התוכנית של היום</button>':''}
    </div></div>`;
  $("coachEditor").innerHTML=html;
}
/* פעולות עורך */
$("coachEditor").addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-addsec]")){harvest();DRAFT.sections.push(blankSection());renderCoach();return;}
  let b;
  if((b=t.closest("[data-rmsec]"))){harvest();DRAFT.sections.splice(+b.dataset.rmsec,1);if(!DRAFT.sections.length)DRAFT.sections=[blankSection()];renderCoach();return;}
  if((b=t.closest("[data-addvid]"))){harvest();DRAFT.sections[+b.dataset.addvid].videos.push({label:"",url:""});renderCoach();return;}
  if((b=t.closest("[data-rmvid]"))){harvest();const[si,vi]=b.dataset.rmvid.split("-").map(Number);DRAFT.sections[si].videos.splice(vi,1);renderCoach();return;}
  if((b=t.closest("[data-addmet]"))){harvest();DRAFT.sections[+b.dataset.addmet].metrics.push({label:"",unit:""});renderCoach();return;}
  if((b=t.closest("[data-rmmet]"))){harvest();const[si,mi]=b.dataset.rmmet.split("-").map(Number);DRAFT.sections[si].metrics.splice(mi,1);renderCoach();return;}
  if(t.id==="edSave"){
    harvest(); t.textContent="שומר…";
    DRAFT.sections=DRAFT.sections.filter(s=>s.title||s.body||(s.metrics&&s.metrics.length)||(s.videos&&s.videos.length));
    await putProgram(SELDATE,DRAFT); PROG=JSON.parse(JSON.stringify(DRAFT)); PROGDATES[SELDATE]=true;
    t.textContent="✓ פורסם!"; setTimeout(()=>t.textContent="💾 שמירה ופרסום לכל המתאמנים",1300); renderWeek();
    return;
  }
  if(t.id==="edDelete"){ if(!confirm("למחוק את כל התוכנית של היום?"))return; await delProgramCloud(SELDATE); PROG=null; delete PROGDATES[SELDATE]; DRAFT=null; renderCoach(); renderWeek(); return; }
  if(t.id==="edCopy"){
    harvest(); const y=addDays(SELDATE,-1); const yp=await fetchProgram(y);
    if(!yp){ alert("אין תוכנית באתמול לשכפל ממנה."); return; }
    DRAFT=JSON.parse(JSON.stringify(yp)); DRAFT.sections=(DRAFT.sections||[]).map(s=>({...s,id:genId(),videos:s.videos||[],metrics:s.metrics||[]}));
    renderCoach(); return;
  }
});

/* ---------- מצב מאמן ---------- */
function unlockCoach(){const p=prompt("קוד מאמן:");if(p===null)return;if(p===COACH_PIN){coachOn=true;try{sessionStorage.setItem("bux_coach","1");}catch(e){}document.body.classList.add("coach-on");DRAFT=null;renderCoach();}else alert("קוד שגוי 🔒");}
$("btnUnlock").onclick=unlockCoach;
function saveCtab(){try{localStorage.setItem("bux_ctab",coachTab);}catch(e){}}
$("ctPlan").onclick=()=>{coachTab="plan";saveCtab();renderCoach();};
$("ctTrack").onclick=()=>{coachTab="track";saveCtab();renderCoach();};

/* ---------- מתגי תצוגה ---------- */
function setView(v){
  document.body.classList.remove("v-member","v-coach");document.body.classList.add("v-"+v);
  $("btnMember").classList.toggle("active",v==="member");$("btnCoach").classList.toggle("active",v==="coach");
  try{localStorage.setItem("bux_view",v);}catch(e){}
  if(v==="coach"){if(coachOn){document.body.classList.add("coach-on");renderCoach();}else renderWeek();}
  else renderMember();
}
$("btnMember").onclick=()=>setView("member");
$("btnCoach").onclick=()=>setView("coach");

/* ---------- טעינה ורענון ---------- */
async function reload(){ await loadAll(); if(document.body.classList.contains("v-coach")&&coachOn){DRAFT=null;renderCoach();} else renderMember(); }
async function init(){
  if(coachOn)document.body.classList.add("coach-on");
  renderMe();
  let v="member";try{v=localStorage.getItem("bux_view")||"member";}catch(e){}
  setView(v);
  await reload();
  if(!MEMBER)askName();
  setInterval(async()=>{
    const focused=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if(focused)return;
    const inCoach=document.body.classList.contains("v-coach")&&coachOn;
    if(inCoach&&coachTab==="plan")return;   // לא לדרוס עריכה
    await loadAll();
    if(inCoach) renderTrack(); else renderMember();
  },1000*20);
}
init();
</script>
